[package]
name = "persephone-test-storage"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
matrix-sdk-sqlite = { version = "=0.19.1", features = ["bundled", "crypto-store"] }
matrix-sdk-crypto = "=0.19.1"
matrix-sdk-base = "=0.19.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
ruma = "=0.17.1"
serde_json = "=1.0.154"
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials"] }

