[workspace]
resolver = "3"
members = [
    "crates/call-protocol",
    "crates/call-worker",
    "crates/contracts",
    "crates/core",
    "crates/core-protocol",
    "crates/media-broker",
    "crates/media-decoder",
    "crates/media-protocol",
    "crates/media-sandbox",
    "crates/media-worker",
    "crates/screen-helper",
    "src-tauri",
    "tests/matrix",
    "tests/storage",
    "tests/platform/windows",
]
# Vendored crates (ADR-0043) are patch sources, not members: the workspace
# checks and lints must not run on third-party code.
exclude = ["third_party/*"]

# Shared components and integration test programs. The desktop host follows
# after its security and compatibility gates pass.
[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
# The oldest toolchain whose std the contained media path works with. Older
# toolchains build without error but break image decoding:
# - before 1.97, the wasm32 allocator (dlmalloc 0.2.11) takes heap only from
#   `memory.grow`, which the guest's fixed linear memory always refuses, so
#   every guest allocation fails and the guest traps;
# - before 1.99, std calls `sigaltstack` and `munmap` after `main` returns
#   (runtime cleanup of the main thread's signal stack), and the Linux
#   worker's seccomp allowlist kills it for `sigaltstack`.
rust-version = "1.99"
publish = false

# Keep SDK development builds useful without duplicating full debug/incremental
# artifacts across each package.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

# Release builds: thin cross-crate LTO, one codegen unit, and no debug
# information in the shipped binaries (symbol names stay). Panics unwind, as
# before. This also applies to the release WebAssembly guest.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Vendored LiveKit crates, each with a small marked patch (ADR-0043). See
# PERSEPHONE-PATCH.md in each folder. Reapply the patches for each LiveKit update.
[patch.crates-io]
livekit-net = { path = "third_party/livekit-net-0.2.0" }
libwebrtc = { path = "third_party/libwebrtc-0.4.1" }
webrtc-sys = { path = "third_party/webrtc-sys-0.3.54" }
