# Runs the repository's development check (python tools/dev.py check) on
# Windows, macOS, Ubuntu, and Debian, Arch, Fedora and openSUSE containers.
# Only Windows has a vault, a credential prompt and UI and worker containment;
# elsewhere these fail closed, so the other jobs establish that the code builds
# and its tests pass, not that the application runs. The workflow does not run
# live homeservers, the native sandbox probe or the dependency audit.
# Actions are pinned to full commit SHAs and container images to digests; the
# tag each was taken from is noted alongside. Toolchains are pinned to the
# versions the recorded evidence used.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          "RUSTUP_TOOLCHAIN=$env:RUST_TOOLCHAIN" >> $env:GITHUB_ENV

      # tools/dev.py keeps Cargo and npm caches under .local/cache. Only
      # downloaded sources are cached; build output is too large to keep.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cache/cargo/registry/index
            .local/cache/cargo/registry/cache
            .local/cache/cargo/git/db
            .local/cache/npm
          key: deps-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Install frontend dependencies
        run: python tools/dev.py bootstrap

      - name: Check
        run: python tools/dev.py check

  # GitHub-hosted macOS and Ubuntu runners. rustup and a C toolchain are
  # preinstalled; Ubuntu adds the WebKitGTK headers Tauri links against.
  hosted:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Install Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cache/cargo/registry/index
            .local/cache/cargo/registry/cache
            .local/cache/cargo/git/db
            .local/cache/npm
          key: deps-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}
          restore-keys: deps-${{ matrix.os }}-

      - name: Install frontend dependencies
        run: python tools/dev.py bootstrap

      - name: Check
        run: python tools/dev.py check

  # Other Linux distributions in containers on an Ubuntu runner. Each installs
  # its own build tools and WebKitGTK 4.1 from its package manager; Python is
  # the distribution's own (setup-python's builds target Ubuntu). Packages
  # come from each distribution's current repositories, so only the base image
  # is fixed by its digest.
  container:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ${{ matrix.image }}
      # The openSUSE image sets no PATH, so once a step adds to GITHUB_PATH
      # the runner's PATH would hold only the added directories.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-13
            image: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308 # trixie
            install: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              git ca-certificates curl xz-utils build-essential pkg-config python3 libwebkit2gtk-4.1-dev
          # Arch supports only full upgrades, so this installs the current
          # rolling release on top of the image.
          - name: arch
            image: archlinux:base-devel@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1 # base-devel
            install: >-
              pacman -Syu --noconfirm --needed git curl python webkit2gtk-4.1
          - name: fedora-44
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # 44
            install: >-
              dnf install -y git curl tar gzip xz gcc gcc-c++ make pkgconf-pkg-config python3
              'pkgconfig(webkit2gtk-4.1)'
          - name: opensuse-leap-16.0
            image: opensuse/leap:16.0@sha256:0c459bfe558e59b44b484e0e02dad66a28cdba92d24c8121d3901177938a3175 # 16.0
            install: >-
              zypper --non-interactive install git curl tar gzip xz gcc gcc-c++ make pkg-config python3
              'pkgconfig(webkit2gtk-4.1)'
    steps:
      # Before checkout, so that it clones with git.
      - name: Install build prerequisites
        run: ${{ matrix.install }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.3 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          python3 --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cache/cargo/registry/index
            .local/cache/cargo/registry/cache
            .local/cache/cargo/git/db
            .local/cache/npm
          key: deps-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}
          restore-keys: deps-${{ matrix.name }}-

      - name: Install frontend dependencies
        run: python3 tools/dev.py bootstrap

      - name: Check
        run: python3 tools/dev.py check
