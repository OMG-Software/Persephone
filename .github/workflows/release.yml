# Builds Persephone release bundles for Windows x64, Linux x64 and arm64, and
# universal macOS, and publishes them as a draft GitHub pre-release.
#
# - A pushed `v*` tag is a release run. The tag must equal every manifest
#   version (tools/release.py check-tag), every signing secret must exist,
#   Windows and macOS files are signed, SHA256SUMS is signed with cosign
#   (keyless) and GPG, each file gets a build-provenance attestation, and a
#   draft pre-release is created. The owner reviews and publishes it by hand.
# - workflow_dispatch is a dry run. Signing, cosign, GPG and attestations are
#   skipped, every artifact name ends in `-unsigned`, and no release is made.
#   SHA256SUMS and the SBOM are still produced.
#
# Signing secrets live in the `release` environment, which only tag runs use
# (see docs/release.md). Jobs that build untrusted dependency code get no
# secrets; secrets reach only the bundling and signing steps.
# Actions are pinned to full commit SHAs with the tag noted alongside, as in
# check.yml. Tools are installed at exact versions.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "24.15.0"
  PYTHON_VERSION: "3.14"
  # tauri-cli 2.12.3 was released with tauri 2.12.4 and tauri-build 2.7.3 and
  # uses the same tauri-utils 2.10 configuration schema as Cargo.lock.
  TAURI_CLI_VERSION: "2.12.3"
  CARGO_ABOUT_VERSION: "0.9.2"
  COSIGN_VERSION: "v3.1.3"
  SYFT_VERSION: "v1.54.1"
  # RFC 3161 timestamp server for Windows signatures. The protocol runs over
  # HTTP; the timestamp authority signs its response and signtool checks it.
  WINDOWS_TIMESTAMP_URL: "http://timestamp.digicert.com"
  CARGO_TERM_COLOR: always
  CARGO_HOME: ${{ github.workspace }}/.local/cache/cargo
  npm_config_cache: ${{ github.workspace }}/.local/cache/npm
  PERSEPHONE_MEDIA_GUEST: ${{ github.workspace }}/.local/build/rust/wasm32-unknown-unknown/release/persephone_media_decoder.wasm
  # Empty on a tag; "-unsigned" on a dry run.
  SUFFIX: ${{ github.event_name != 'push' && '-unsigned' || '' }}

jobs:
  # The same check as check.yml plus the dependency audit, the tag/version
  # match and the third-party notices that every bundle includes.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check that the tag matches every version
        if: github.event_name == 'push'
        run: python tools/release.py check-tag "$GITHUB_REF_NAME"

      - name: Read the version
        id: version
        run: |
          version=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cache/cargo/registry/index
            .local/cache/cargo/registry/cache
            .local/cache/cargo/git/db
            .local/cache/npm
          key: release-gate-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}
          restore-keys: release-gate-

      - name: Install frontend dependencies
        run: python tools/dev.py bootstrap

      - name: Check
        run: python tools/dev.py check

      - name: Audit dependencies
        run: python tools/dev.py audit

      - name: Generate third-party notices
        run: |
          cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --root "$RUNNER_TEMP/tools"
          mkdir -p .local/release/notices
          "$RUNNER_TEMP/tools/bin/cargo-about" generate --locked --fail --workspace \
            -c tools/about.toml -o .local/release/notices/THIRD-PARTY-NOTICES.txt tools/about.hbs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: .local/release/notices/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  # Fails a tag run before anything is built when a signing secret is missing.
  # It reads the secrets only to test that they are not empty.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - name: Require every signing secret
        if: github.event_name == 'push'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY \
            GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Dry run
        if: github.event_name != 'push'
        run: echo "Dry run (workflow_dispatch). Signing is skipped and artifact names end in -unsigned."

  windows:
    needs: [gate, preflight]
    runs-on: windows-latest
    timeout-minutes: 120
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    outputs:
      signature: ${{ steps.verify.outputs.signature }}
      subject: ${{ steps.certificate.outputs.subject }}
      thumbprint: ${{ steps.certificate.outputs.thumbprint }}
    env:
      TRIPLE: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target "wasm32-unknown-unknown,$env:TRIPLE"
          "RUSTUP_TOOLCHAIN=$env:RUST_TOOLCHAIN" >> $env:GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cache/cargo/registry/index
            .local/cache/cargo/registry/cache
            .local/cache/cargo/git/db
            .local/cache/npm
          key: release-windows-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}
          restore-keys: release-windows-

      - name: Install the Tauri CLI
        run: |
          cargo install --locked tauri-cli --version "$TAURI_CLI_VERSION" --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: .local/release/notices

      - name: Build the frontend, decoder guest, core and media worker
        run: |
          python tools/dev.py bootstrap
          (cd frontend && npm run build)
          cargo build --locked --release -p persephone-media-decoder --target wasm32-unknown-unknown
          cargo build --locked --release --target "$TRIPLE" \
            -p persephone-core --bin persephone -p persephone-media-worker --bin persephone-media-worker
          mkdir -p src-tauri/binaries
          for name in persephone persephone-media-worker; do
            cp ".local/build/rust/$TRIPLE/release/$name.exe" "src-tauri/binaries/$name-$TRIPLE.exe"
          done
          python tools/release.py bundle-config --notices .local/release/notices/THIRD-PARTY-NOTICES.txt \
            --output .local/release/tauri.release.json \
            ${{ github.event_name == 'push' && '--windows-sign' || '' }}

      - name: Build the UI
        working-directory: src-tauri
        run: cargo tauri build --target "$TRIPLE" --no-bundle --config ../.local/release/tauri.release.json -- --locked

      # Signing starts here, after all dependency code has been compiled.
      # tools/sign_windows.ps1 is the only signing code; a later provider
      # replaces that script.
      - name: Decode the signing certificate
        id: certificate
        if: github.event_name == 'push'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'windows-signing'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          # Only the runner account may read the directory.
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $acl.SetAccessRuleProtection($true, $false)
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($me, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')))
          Set-Acl -Path $dir -AclObject $acl
          $pfx = Join-Path $dir 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:WINDOWS_CERTIFICATE_PASSWORD, $flags)
          if (-not $cert.HasPrivateKey) { throw 'WINDOWS_CERTIFICATE has no private key' }
          $eku = $cert.Extensions | Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] }
          if (-not ($eku -and ($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }))) {
            throw 'WINDOWS_CERTIFICATE is not a code-signing certificate'
          }
          if ($cert.NotAfter -lt (Get-Date)) { throw "WINDOWS_CERTIFICATE expired on $($cert.NotAfter)" }
          $thumbprint = $cert.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256)
          "WINDOWS_SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
          "WINDOWS_SIGNING_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          "subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT
          "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT
          Write-Host "Signing certificate: $($cert.Subject), SHA-256 $thumbprint, valid until $($cert.NotAfter)"

      # Stage 1 and 2: Tauri calls tools/sign_windows.ps1 for the sidecars and
      # the main binary before it packs them, then for the NSIS uninstaller,
      # and for the finished NSIS and MSI installers.
      - name: Bundle and sign
        if: github.event_name == 'push'
        working-directory: src-tauri
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNATURE_STATE: ${{ runner.temp }}/windows-signing-log.txt
        run: cargo tauri bundle --target "$TRIPLE" --bundles nsis,msi --config ../.local/release/tauri.release.json

      - name: Bundle without signing (dry run)
        if: github.event_name != 'push'
        working-directory: src-tauri
        run: cargo tauri bundle --target "$TRIPLE" --bundles nsis,msi --no-sign --config ../.local/release/tauri.release.json

      # Checks the installers and the executables inside them. A self-signed
      # certificate passes with signature=self-signed; any other failure fails.
      - name: Verify the signatures
        id: verify
        if: github.event_name == 'push'
        shell: pwsh
        env:
          WINDOWS_SIGNATURE_STATE: ${{ runner.temp }}/windows-signature.txt
        run: |
          $bundle = ".local/build/rust/$env:TRIPLE/release/bundle"
          $nsis = @(Get-ChildItem "$bundle/nsis/*.exe")
          $msi = @(Get-ChildItem "$bundle/msi/*.msi")
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) { throw 'expected one NSIS and one MSI installer' }
          $extract = Join-Path $env:RUNNER_TEMP 'installer-contents'
          $admin = Start-Process msiexec.exe -ArgumentList '/a', "`"$($msi[0].FullName)`"", '/qn', "TARGETDIR=`"$extract\msi`"" -Wait -PassThru
          if ($admin.ExitCode -ne 0) { throw "MSI extraction failed with $($admin.ExitCode)" }
          7z x -y "-o$extract\nsis" $nsis[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "NSIS extraction failed with $LASTEXITCODE" }
          $files = @($nsis[0].FullName, $msi[0].FullName)
          foreach ($kind in 'msi', 'nsis') {
            foreach ($name in 'persephone.exe', 'persephone-ui.exe', 'persephone-media-worker.exe') {
              $found = @(Get-ChildItem -Path "$extract\$kind" -Recurse -File -Filter $name)
              if ($found.Count -ne 1) { throw "$name found $($found.Count) times in the $kind installer" }
              $files += $found[0].FullName
            }
          }
          & ./tools/sign_windows.ps1 -VerifyOnly @files
          $signature = if (Select-String -Path $env:WINDOWS_SIGNATURE_STATE -Pattern '^self-signed ' -Quiet) { 'self-signed' } else { 'trusted' }
          "signature=$signature" >> $env:GITHUB_OUTPUT
          Write-Host "Windows signature: $signature"

      - name: Remove the signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-signing') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Collect the installers
        run: |
          mkdir -p .local/release/out
          for file in .local/build/rust/$TRIPLE/release/bundle/nsis/*.exe .local/build/rust/$TRIPLE/release/bundle/msi/*.msi; do
            name=$(basename "$file")
            cp "$file" ".local/release/out/${name%.*}$SUFFIX.${name##*.}"
          done
          ls -l .local/release/out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persephone-windows-x64${{ env.SUFFIX }}
          path: .local/release/out/*
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    needs: [gate, preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 sets the oldest glibc the bundles support.
          - arch: x64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
    env:
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # check.yml's WebKitGTK headers, plus what the AppImage bundler needs:
      # `file` for linuxdeploy and librsvg2 for the GTK image loaders it copies.
      # Tauri's .deb and .rpm writers are part of the CLI.
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential pkg-config file librsvg2-dev

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.3 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "wasm32-unknown-unknown,$TRIPLE"
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cache/cargo/registry/index
            .local/cache/cargo/registry/cache
            .local/cache/cargo/git/db
            .local/cache/npm
          key: release-linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}
          restore-keys: release-linux-${{ matrix.arch }}-

      - name: Install the Tauri CLI
        run: |
          cargo install --locked tauri-cli --version "$TAURI_CLI_VERSION" --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: .local/release/notices

      - name: Build the frontend, decoder guest, core and media worker
        run: |
          python tools/dev.py bootstrap
          (cd frontend && npm run build)
          cargo build --locked --release -p persephone-media-decoder --target wasm32-unknown-unknown
          cargo build --locked --release --target "$TRIPLE" \
            -p persephone-core --bin persephone -p persephone-media-worker --bin persephone-media-worker
          mkdir -p src-tauri/binaries
          for name in persephone persephone-media-worker; do
            cp ".local/build/rust/$TRIPLE/release/$name" "src-tauri/binaries/$name-$TRIPLE"
          done
          python tools/release.py bundle-config --notices .local/release/notices/THIRD-PARTY-NOTICES.txt \
            --output .local/release/tauri.release.json

      - name: Build and bundle
        working-directory: src-tauri
        run: |
          cargo tauri build --target "$TRIPLE" --no-bundle --config ../.local/release/tauri.release.json -- --locked
          cargo tauri bundle --target "$TRIPLE" --bundles appimage,deb,rpm --config ../.local/release/tauri.release.json

      - name: Collect the bundles
        run: |
          mkdir -p .local/release/out
          bundle=".local/build/rust/$TRIPLE/release/bundle"
          for file in "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm; do
            name=$(basename "$file")
            cp "$file" ".local/release/out/${name%.*}$SUFFIX.${name##*.}"
          done
          ls -l .local/release/out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persephone-linux-${{ matrix.arch }}${{ env.SUFFIX }}
          path: .local/release/out/*
          if-no-files-found: error

  macos:
    needs: [gate, preflight]
    runs-on: macos-latest
    timeout-minutes: 120
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    env:
      TRIPLE: universal-apple-darwin
      # Matches bundle.macOS.minimumSystemVersion for the sidecars too.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/cache/cargo/registry/index
            .local/cache/cargo/registry/cache
            .local/cache/cargo/git/db
            .local/cache/npm
          key: release-macos-${{ hashFiles('Cargo.lock', 'frontend/package-lock.json') }}
          restore-keys: release-macos-

      - name: Install the Tauri CLI
        run: |
          cargo install --locked tauri-cli --version "$TAURI_CLI_VERSION" --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: .local/release/notices

      # tauri-build looks for each sidecar under the arch it compiles for, and
      # the bundler under universal-apple-darwin, so both forms are placed.
      - name: Build the frontend, decoder guest, core and media worker
        run: |
          python tools/dev.py bootstrap
          (cd frontend && npm run build)
          cargo build --locked --release -p persephone-media-decoder --target wasm32-unknown-unknown
          mkdir -p src-tauri/binaries
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$arch" \
              -p persephone-core --bin persephone -p persephone-media-worker --bin persephone-media-worker
            for name in persephone persephone-media-worker; do
              cp ".local/build/rust/$arch/release/$name" "src-tauri/binaries/$name-$arch"
            done
          done
          for name in persephone persephone-media-worker; do
            lipo -create -output "src-tauri/binaries/$name-$TRIPLE" \
              "src-tauri/binaries/$name-aarch64-apple-darwin" "src-tauri/binaries/$name-x86_64-apple-darwin"
            lipo -info "src-tauri/binaries/$name-$TRIPLE"
          done
          python tools/release.py bundle-config --notices .local/release/notices/THIRD-PARTY-NOTICES.txt \
            --output .local/release/tauri.release.json

      - name: Build the UI
        working-directory: src-tauri
        run: cargo tauri build --target "$TRIPLE" --no-bundle --config ../.local/release/tauri.release.json -- --locked

      - name: Write the App Store Connect API key
        if: github.event_name == 'push'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          dir="$RUNNER_TEMP/apple"
          mkdir -m 700 -p "$dir"
          (umask 077 && printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$dir/AuthKey.p8")
          echo "APPLE_API_KEY_PATH=$dir/AuthKey.p8" >> "$GITHUB_ENV"

      # Tauri imports the certificate into a temporary keychain, signs the
      # sidecars, the main binary and the app with the hardened runtime,
      # notarizes the app and staples the ticket.
      - name: Bundle, sign and notarize
        if: github.event_name == 'push'
        working-directory: src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cargo tauri bundle --target "$TRIPLE" --bundles app,dmg --config ../.local/release/tauri.release.json

      - name: Bundle without signing (dry run)
        if: github.event_name != 'push'
        working-directory: src-tauri
        run: cargo tauri bundle --target "$TRIPLE" --bundles app,dmg --no-sign --config ../.local/release/tauri.release.json

      - name: Verify the signatures
        if: github.event_name == 'push'
        run: |
          app=".local/build/rust/$TRIPLE/release/bundle/macos/Persephone.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for binary in persephone-ui persephone persephone-media-worker; do
            details=$(codesign --display --verbose=2 "$app/Contents/MacOS/$binary" 2>&1)
            echo "$details" | grep -q 'flags=.*runtime' || { echo "::error::$binary lacks the hardened runtime"; exit 1; }
            lipo "$app/Contents/MacOS/$binary" -verify_arch arm64 x86_64
          done
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Remove the App Store Connect API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple"

      - name: Collect the bundles
        run: |
          mkdir -p .local/release/out
          bundle=".local/build/rust/$TRIPLE/release/bundle"
          for file in "$bundle"/dmg/*.dmg; do
            name=$(basename "$file")
            cp "$file" ".local/release/out/${name%.*}$SUFFIX.${name##*.}"
            # The same app as a zip, with its stapled ticket and signatures.
            ditto -c -k --keepParent "$bundle/macos/Persephone.app" ".local/release/out/${name%.dmg}$SUFFIX.app.zip"
          done
          ls -l .local/release/out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persephone-macos-universal${{ env.SUFFIX }}
          path: .local/release/out/*
          if-no-files-found: error

  # Checksums, SBOM, signatures and attestations over every release file.
  checksums:
    needs: [gate, windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # cosign keyless signing and attestations
      attestations: write
    outputs:
      gpg_fingerprint: ${{ steps.gpg.outputs.fingerprint }}
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: persephone-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: dist

      - name: Create the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/persephone-${{ env.VERSION }}-sbom${{ env.SUFFIX }}.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false

      - name: Create SHA256SUMS
        working-directory: dist
        run: |
          mv THIRD-PARTY-NOTICES.txt "persephone-$VERSION-THIRD-PARTY-NOTICES$SUFFIX.txt"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign SHA256SUMS with cosign (keyless)
        if: github.event_name == 'push'
        working-directory: dist
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS

      - name: Sign SHA256SUMS with GPG
        id: gpg
        if: github.event_name == 'push'
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')
          [ -n "$fingerprint" ] || { echo "::error::GPG_PRIVATE_KEY holds no secret key"; exit 1; }
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$fingerprint" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Remove the GPG key
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/gnupg" --kill all 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/gnupg"

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          create-storage-record: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files${{ env.SUFFIX }}
          path: dist/*
          if-no-files-found: error

  # The only job that can write to the repository. Tag runs only.
  release:
    if: github.event_name == 'push'
    needs: [gate, windows, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      WINDOWS_SIGNATURE: ${{ needs.windows.outputs.signature }}
      WINDOWS_SUBJECT: ${{ needs.windows.outputs.subject }}
      WINDOWS_THUMBPRINT: ${{ needs.windows.outputs.thumbprint }}
      GPG_FINGERPRINT: ${{ needs.checksums.outputs.gpg_fingerprint }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Write the release notes
        run: |
          if [ "$WINDOWS_SIGNATURE" = self-signed ]; then
            windows="The Windows files are signed with a self-signed certificate. Windows will still show an unknown-publisher warning. Do not add this certificate to your trusted roots. Verify downloads with the signed SHA256SUMS or \`gh attestation verify\`."
          elif [ "$WINDOWS_SIGNATURE" = trusted ]; then
            windows="The Windows installers and the programs inside them are Authenticode-signed."
          else
            echo "::error::unknown Windows signature state '$WINDOWS_SIGNATURE'"; exit 1
          fi
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cat > notes.md <<EOF
          **Pre-release. Not for high-risk use.** Persephone has open feasibility and
          production security gates. A signed build does not mean that the
          application is ready for users who need strong protection.

          - Windows x64: NSIS installer (per-user) and MSI.
          - Linux x64 and arm64: AppImage, .deb and .rpm (built on Ubuntu 22.04).
          - macOS universal (Apple silicon and Intel): .dmg and a zipped app,
            signed with Developer ID and notarized. **macOS has not been tested
            live**; it is built and tested in CI only.
          - There is no automatic update. Install new versions by hand.

          ## Windows signature

          $windows

          Certificate subject: \`$WINDOWS_SUBJECT\`
          SHA-256 thumbprint: \`$WINDOWS_THUMBPRINT\`

          ## Verify your download

          \`SHA256SUMS\` lists every file in this release. Check it is genuine,
          then check your file against it.

          \`\`\`sh
          # cosign (keyless; this workflow's identity)
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity "$identity" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS

          # GPG (key fingerprint $GPG_FINGERPRINT)
          gpg --verify SHA256SUMS.asc SHA256SUMS

          # Your file's checksum
          sha256sum --ignore-missing -c SHA256SUMS

          # GitHub build provenance
          gh attestation verify <file> --repo $GITHUB_REPOSITORY
          \`\`\`

          See docs/release.md in the repository for details.
          EOF
          cat notes.md

      - name: Create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --prerelease --title "Persephone $VERSION" --notes-file notes.md
