# SonarQube Cloud analysis settings, read by .github/workflows/sonar.yml.
sonar.projectKey=OMG-Software_Persephone
sonar.organization=omg-software
sonar.projectName=Persephone
sonar.sourceEncoding=UTF-8

# First-party code only. Generated contracts, dependencies, build output under
# .local and the design hand-off are not analysed.
sonar.sources=crates,src-tauri/src,frontend/src,tools
sonar.exclusions=**/tests/**,**/tests.rs,crates/contracts/generated/**,**/node_modules/**
sonar.tests=crates,src-tauri/tests,frontend/tests,tests
# Test directories, and Rust test modules kept in their own tests.rs file.
sonar.test.inclusions=**/tests/**,**/tests.rs

# Line coverage of the frontend's TypeScript, written by the frontend tests
# (python tools/dev.py frontend). Svelte coverage is not reported.
sonar.javascript.lcov.reportPaths=.local/coverage/frontend/lcov.info
# Line coverage of the Rust crates, written by the instrumented Rust tests
# (python tools/dev.py coverage). A contained process cannot write a profile,
# so the media worker runs uninstrumented and its own tests are left out: its
# crate shows little coverage.
sonar.rust.lcov.reportPaths=.local/coverage/rust/lcov.info
# Nor is the development tools' Python coverage (tests/tools runs in the
# check workflow). Without a report, every changed line would count as
# uncovered. The tools are still analysed for issues.
sonar.coverage.exclusions=tools/**/*.py
