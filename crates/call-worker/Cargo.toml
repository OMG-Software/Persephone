[package]
name = "persephone-call-worker"
version = "0.0.1"
description = "Contained call worker process: joins one LiveKit room with frame encryption and platform audio (ADR-0043)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
persephone-call-protocol = { path = "../call-protocol" }
persephone-media-protocol = { path = "../media-protocol" }
livekit = { version = "=0.11.0", default-features = false, features = ["native", "rustls-tls-native-roots"] }
livekit-signaling = { version = "=0.2.0", default-features = false }
tokio = { version = "=1.53.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "=0.1.19", default-features = false }
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
# Camera capture through Media Foundation (ADR-0048): only these features.
windows = { version = "=0.62.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Containment (ADR-0049): the camera channel's recvmsg, the Landlock system
# calls and the seccomp filters. PipeWire: the camera portal path.
libc = "=0.2.191"
seccompiler = "=0.5.0"
pipewire = { version = "=0.10.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Camera capture through AVFoundation (ADR-0049): only these features.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSObject",
  "NSString",
  "NSValue",
] }
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "dispatch2",
  "objc2-core-media",
  "objc2-core-video",
  "AVCaptureDevice",
  "AVCaptureInput",
  "AVCaptureOutput",
  "AVCaptureOutputBase",
  "AVCaptureSession",
  "AVCaptureSessionPreset",
  "AVCaptureVideoDataOutput",
  "AVMediaFormat",
] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CMFormatDescription",
  "CMSampleBuffer",
  "CMTime",
  "objc2-core-video",
] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }

[features]
# Development only: run without the contained launcher and report the
# containment check's result without exiting. Never enabled in a build that
# ships.
dev-uncontained = []
# Development only, for disposable loopback servers: accept a `ws://127.0.0.1`
# or `ws://[::1]` SFU URL. Never enabled in a build that ships. The core must be
# built with its own `dev-disposable-servers` feature to send one.
dev-disposable-servers = ["persephone-call-protocol/dev-disposable-servers"]
