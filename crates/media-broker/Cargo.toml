[package]
name = "persephone-media-broker"
version = "0.0.1"
description = "Launches the media worker under OS containment and enforces its deadline and resource limits"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
persephone-media-protocol = { path = "../media-protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# Linux and macOS: fork-to-exec setup (setsid, prctl, rlimits), wait4 and
# kill for the worker, and the macOS sandbox_check declaration's types.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
png = { version = "=0.18.1", default-features = false }
