[package]
name = "persephone-media-broker"
version = "0.0.0"
description = "Launches the media worker under OS containment and enforces its deadline and resource limits"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
persephone-media-protocol = { path = "../media-protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
png = { version = "=0.18.1", default-features = false }
