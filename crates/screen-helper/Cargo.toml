[package]
name = "persephone-screen-helper"
version = "0.3.0"
description = "Windows screen capture helper: captures the one monitor the user approved with Windows.Graphics.Capture and writes bounded frames to the call worker (ADR-0067)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "persephone-screen-helper"
path = "src/main.rs"

[dependencies]
persephone-call-protocol = { path = "../call-protocol" }

[target.'cfg(windows)'.dependencies]
# Windows.Graphics.Capture of one monitor (`wgc.rs`, which the containment gate
# compiles too) and the pipe checks of `run.rs`. The same locked crate as the
# call worker and the gate; `Win32_Storage_FileSystem` (`GetFileType`) and
# `Win32_System_Pipes` (`PeekNamedPipe`, and `CreatePipe` in the tests, which also
# needs `Win32_Security`) are
# the only features beyond the gate's.
windows = { version = "=0.62.2", default-features = false, features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
] }
