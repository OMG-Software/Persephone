[package]
name = "persephone-core"
version = "0.3.0"
description = "Key-holding core process: application entry point; starts and serves the keyless UI (ADR-0004)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "persephone_core"

[[bin]]
name = "persephone"
path = "src/main.rs"

[dependencies]
persephone-contracts = { path = "../contracts" }
persephone-core-protocol = { path = "../core-protocol" }
persephone-call-protocol = { path = "../call-protocol" }
persephone-media-protocol = { path = "../media-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
getrandom = "=0.4.3"
# ADR-0006: Argon2id derives the key that seals the store key under the
# profile passphrase. No default features: no password-hash strings or OS RNG.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
# Already compiled for the SDK's store cipher, with the same features plus
# zeroize, so the cipher's key is cleared on drop.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# Only the `Stream` trait, to read the SDK's room-key stream; already in the
# graph through matrix-sdk at this version.
futures-core = { version = "=0.3.34", default-features = false }
# The opt-in diagnostic log (ADR-0058): its `tracing` subscriber and `log`
# logger, and the patterns that remove credentials from library text. All
# three are already in the lock through matrix-sdk and reqwest, at these
# versions and features.
log = { version = "=0.4.34", default-features = false }
regex = "=1.13.1"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
# Same explicit features as the P0 Matrix fixtures; rustls-aws-lc-rs is also
# what gives reqwest its TLS backend when the core is built on its own.
# experimental-send-custom-to-device: the Olm-encrypted call key to-device
# events (ADR-0043).
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "experimental-send-custom-to-device", "rustls-aws-lc-rs"] }
matrix-sdk-base = "=0.19.1"
matrix-sdk-crypto = "=0.19.1"
matrix-sdk-sqlite = { version = "=0.19.1", features = ["bundled", "crypto-store"] }
# socks: the profile's SOCKS5 proxy (ADR-0028), through hyper-util's proxy
# connector, which reqwest already builds; no other crate.
reqwest = { version = "=0.13.5", default-features = false, features = ["socks"] }
# The MSC4195 LiveKit participant identity, a SHA-256 hash (ADR-0056). The
# version that matrix-sdk, matrix-sdk-crypto and vodozemac already use; no
# default features.
sha2 = { version = "=0.11.1", default-features = false }
# net and io-util: the OAuth sign-in's loopback redirect (ADR-0030).
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"
zeroize = "=1.9.1"

[features]
# Development only, for the disposable homeservers in tools/servers: accept
# plain http:// to 127.0.0.1 and [::1], and allow a test credential source that
# reads the harness profile instead of showing the native prompt. Never enabled
# by default, in CI or in release builds. It also lets the call protocol
# carry a loopback ws:// SFU URL, so the worker must be built with it too,
# and gives the call worker private-network access, so it can reach a
# disposable SFU on the WSL address (the live call test).
dev-disposable-servers = [
  "persephone-call-protocol/dev-disposable-servers",
  "persephone-media-broker/dev-private-network",
]

[dev-dependencies]
tempfile = "=3.27.0"
# Paused time for the call timers' tests only (ADR-0063). No new package.
tokio = { version = "=1.53.3", features = ["test-util"] }
wiremock = "=0.6.5"

[target.'cfg(unix)'.dependencies]
# Linux and macOS: open flags for reading a picked image (O_NOFOLLOW).
libc = "=0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
# ADR-0010. Both are already in the lock through the Tauri GTK stack.
# GTK3 runs the core's prompts and file choosers on its `core-gtk` thread;
# `gtk::glib` is used through this crate, not as a separate dependency. See
# docs/evidence/dependencies.md for the glib 0.18.5 advisory.
gtk = { version = "=0.18.2", default-features = false }
# The session bus: the Secret Service vault (plain session), the systemd user
# manager's transient scope for the UI, and the OpenURI portal. Only the
# blocking API on zbus's own async-io executor; no tokio integration.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
# ADR-0011. All are already in the lock through the Tauri and TLS stacks.
# The Keychain vault: core-foundation builds the SecItem queries,
# security-framework(-sys) names the keychain and its constants.
core-foundation = { version = "=0.10.1", default-features = false, features = ["link"] }
security-framework = { version = "=3.7.0", default-features = false }
security-framework-sys = { version = "=2.17.0", default-features = false }
# The AppKit run loop on the main thread, its prompts (NSAlert with text
# fields), the file panels (NSOpenPanel, NSSavePanel) and opening a confirmed
# link (NSWorkspace, ADR-0024); dispatch2 hands work to the main queue. The
# idle time (ADR-0025) is one CoreGraphics function declared in the code, with
# no binding crate.
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSGeometry",
  "NSRange",
  "NSString",
  "NSURL",
  "objc2-core-foundation",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSAlert",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSEvent",
  "NSGraphicsContext",
  "NSMenu",
  "NSMenuItem",
  "NSOpenPanel",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSSavePanel",
  "NSSecureTextField",
  "NSTextField",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
# The contained media worker (ADR-0003, ADR-0009, ADR-0010, ADR-0011).
persephone-media-broker = { path = "../media-broker" }

[target.'cfg(windows)'.dependencies]
# Storage_FileSystem: the share mode and reparse-point flags for reading a
# picked image; UI_Controls_Dialogs: the native file dialog (GetOpenFileNameW);
# UI_Shell: the default profile's base folder (SHGetKnownFolderPath) and
# opening a confirmed link (ShellExecuteW); UI_Input_KeyboardAndMouse and
# System_SystemInformation: the idle time (GetLastInputInfo, GetTickCount);
# Security_WinTrust, Security_Cryptography_Catalog and System_ProcessStatus: the
# loaded-module report (WinVerifyTrust, catalog lookup, module listing;
# Cryptography_Sip gates the WTHelper* signer functions); UI_HiDpi: the screen
# chooser reads monitor rectangles in physical pixels, as the call worker does
# (SetThreadDpiAwarenessContext).
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
