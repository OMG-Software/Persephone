[package]
name = "persephone-core"
version = "0.0.1"
description = "Key-holding core process: application entry point; starts and serves the keyless UI (ADR-0004)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "persephone_core"

[[bin]]
name = "persephone"
path = "src/main.rs"

[dependencies]
persephone-contracts = { path = "../contracts" }
persephone-core-protocol = { path = "../core-protocol" }
persephone-media-protocol = { path = "../media-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
getrandom = "=0.4.3"
# ADR-0006: Argon2id derives the key that seals the store key under the
# profile passphrase. No default features: no password-hash strings or OS RNG.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
# Already compiled for the SDK's store cipher, with the same features plus
# zeroize, so the cipher's key is cleared on drop.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# Only the `Stream` trait, to read the SDK's room-key stream; already in the
# graph through matrix-sdk at this version.
futures-core = { version = "=0.3.34", default-features = false }
# Same explicit features as the P0 Matrix fixtures; rustls-aws-lc-rs is also
# what gives reqwest its TLS backend when the core is built on its own.
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "rustls-aws-lc-rs"] }
matrix-sdk-base = "=0.19.1"
matrix-sdk-crypto = "=0.19.1"
matrix-sdk-sqlite = { version = "=0.19.1", features = ["bundled", "crypto-store"] }
# socks: the profile's SOCKS5 proxy (ADR-0028), through hyper-util's proxy
# connector, which reqwest already builds; no other crate.
reqwest = { version = "=0.13.5", default-features = false, features = ["socks"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time"] }
url = "=2.5.8"
zeroize = "=1.9.1"

[features]
# Development only, for the disposable homeservers in tools/servers: accept
# plain http:// to 127.0.0.1 and [::1], and allow a test credential source that
# reads the harness profile instead of showing the native prompt. Never enabled
# by default, in CI or in release builds.
dev-disposable-servers = []

[dev-dependencies]
tempfile = "=3.27.0"
wiremock = "=0.6.5"

[target.'cfg(unix)'.dependencies]
# Linux and macOS: open flags for reading a picked image (O_NOFOLLOW).
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
# ADR-0011. All are already in the lock through the Tauri and TLS stacks.
# The Keychain vault: core-foundation builds the SecItem queries,
# security-framework(-sys) names the keychain and its constants.
core-foundation = { version = "=0.10.1", default-features = false, features = ["link"] }
security-framework = { version = "=3.7.0", default-features = false }
security-framework-sys = { version = "=2.17.0", default-features = false }
# The AppKit run loop on the main thread, its prompts (NSAlert with text
# fields) and the file panel (NSOpenPanel); dispatch2 hands work to the main
# queue.
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSGeometry",
  "NSRange",
  "NSString",
  "NSURL",
  "objc2-core-foundation",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSAlert",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSEvent",
  "NSGraphicsContext",
  "NSMenu",
  "NSMenuItem",
  "NSOpenPanel",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSSavePanel",
  "NSSecureTextField",
  "NSTextField",
  "NSView",
  "NSWindow",
] }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
# The contained media worker (ADR-0003, ADR-0009, ADR-0010, ADR-0011).
persephone-media-broker = { path = "../media-broker" }

[target.'cfg(windows)'.dependencies]
# Storage_FileSystem: the share mode and reparse-point flags for reading a
# picked image; UI_Controls_Dialogs: the native file dialog (GetOpenFileNameW);
# UI_Shell: the default profile's base folder (SHGetKnownFolderPath) and
# opening a confirmed link (ShellExecuteW); UI_Input_KeyboardAndMouse and
# System_SystemInformation: the idle time (GetLastInputInfo, GetTickCount).
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
